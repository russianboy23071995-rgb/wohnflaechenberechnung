[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wohnflaechenberechnung"
version = "0.1.0"
description = "Professionelle Wohn- und Nutzflächenberechnung nach WoFlV – NOVIKOV | PLAN & MAß"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "Jinja2>=3.1.0",
    "weasyprint>=62.0",
]

[project.scripts]
wohnflaechen = "wohnflaechen.presentation.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wohnflaechen.presentation.pdf" = ["templates/*", "static/*", "static/*.png"]
